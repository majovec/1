name: Analyze

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Kódy líg oddělené čárkou, např. E0,D1,SP1,I1,F1 (prázdné = E0)"
        required: false
        default: ""
  schedule:
    - cron: "20 6,18 * * *"

permissions:
  contents: write

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stáhnout data, otestovat model, předpovědět zápasy
        env:
          LEAGUES: ${{ inputs.leagues || vars.LEAGUES || 'E0' }}
        run: python -m app.pipeline

      - name: Uložit výsledky do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Žádné změny."
          else
            git commit -m "Aktualizace analýzy $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
