name: Unpack ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Cesta k ZIP souboru v repozitáři (např. upload/soubory.zip)"
        required: true
        default: "upload/soubory.zip"
      target_dir:
        description: "Cílová složka pro rozbalené soubory (. = kořen repozitáře)"
        required: true
        default: "unpacked"
      delete_zip:
        description: "Smazat ZIP po rozbalení?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Rozbalit ZIP
        run: |
          if [ ! -f "${{ inputs.zip_path }}" ]; then
            echo "ZIP soubor ${{ inputs.zip_path }} nebyl nalezen!"
            exit 1
          fi
          mkdir -p "${{ inputs.target_dir }}"
          unzip -o "${{ inputs.zip_path }}" -d "${{ inputs.target_dir }}"

      - name: Smazat ZIP (volitelně)
        if: ${{ inputs.delete_zip }}
        run: git rm -f "${{ inputs.zip_path }}"

      - name: Commit a push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Žádné změny k commitu."
          else
            git commit -m "Rozbalen ${{ inputs.zip_path }} do ${{ inputs.target_dir }}"
            git push
          fi
