
name: Unpack ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "CHYBA: ZIP musí být v kořenové složce repozitáře."
            exit 1
          fi

          mkdir -p /tmp/project
          unzip -oq "$ZIP_FILE" -d /tmp/project

          SOURCE="/tmp/project/football-ai-analyst-v2"

          if [ ! -d "$SOURCE" ]; then
            SOURCE="$(find /tmp/project -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi

          if [ -z "${SOURCE:-}" ] || [ ! -d "$SOURCE" ]; then
            echo "CHYBA: ZIP neobsahuje očekávanou složku projektu."
            exit 1
          fi

          rsync -a \
            --exclude='.github/workflows/' \
            "$SOURCE"/ ./

          rm -f "$ZIP_FILE"

      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Žádné změny."
            exit 0
          fi

          git commit -m "Import project from ZIP"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
