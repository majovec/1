name: Unpack ZIP

on:
  push:
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rozbalit všechny ZIPy v kořeni
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "V kořeni není žádný ZIP."; exit 1; }
          for z in "${zips[@]}"; do
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            if [ "$(ls -A "$tmp" | wc -l)" = "1" ] && [ -d "$tmp/$(ls -A "$tmp")" ]; then
              src="$tmp/$(ls -A "$tmp")"
            else
              src="$tmp"
            fi
            rm -rf "$src/.github"
            cp -a "$src/." .
            git rm -f -q "$z"
          done

      - name: Commit a push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Žádné změny."
          else
            git commit -m "Rozbaleno z ZIPu"
            git push
          fi
