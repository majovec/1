
name: Unpack uploaded ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-zip-main
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP nebyl nalezen v kořenové složce."
            exit 1
          fi

          mkdir -p /tmp/project-import
          unzip -q "$ZIP_FILE" -d /tmp/project-import

          SOURCE_DIR="/tmp/project-import/football-ai-analyst-v2"

          if [ ! -d "$SOURCE_DIR" ]; then
            SOURCE_DIR="$(find /tmp/project-import -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi

          if [ -z "${SOURCE_DIR:-}" ] || [ ! -d "$SOURCE_DIR" ]; then
            echo "Nepodařilo se najít složku projektu v ZIPu."
            exit 1
          fi

          rsync -a --exclude='.github/workflows/' "$SOURCE_DIR"/ ./
          rm -f "$ZIP_FILE"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Není co ukládat."
            exit 0
          fi

          git commit -m "Import project source from ZIP"

          # Zkus bezpečně aktualizovat větev, pokud se mezitím změnila.
          git pull --rebase origin main
          git push origin HEAD:main
